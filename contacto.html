
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración básica de la página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePlus | Contáctanos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="contacto.css">
</head>

<body>
<div id="navbar-container"></div>

<!-- ==================================================
     3. CONTENIDO PRINCIPAL
=================================================== -->

<!-- SE AGREGÓ pt-5 Y mt-5 PARA SEPARARLO DEL NAVBAR -->
<main class="container-fluid px-3 px-lg-5 py-4 pt-5 mt-5">

    <div class="row g-4">

        <!-- 3A. TARJETA CON INFORMACIÓN DE CONTACTO -->
        <aside class="col-12 col-lg-4">

            <div class="card contact-card h-100">

                <div class="card-body p-4 p-xl-5">

                    <h2 class="section-title mb-4">
                        Información de contacto
                    </h2>

                    <!-- Dirección -->
                    <div class="d-flex align-items-center gap-3 mb-3 info-row">

                        <div>
                            <h3>Dirección</h3>
                            <p>
                                Av. Principal 123<br>
                                La Paz, Bolivia
                            </p>
                        </div>

                    </div>

                    <!-- Teléfonos -->
                    <div class="d-flex align-items-center gap-3 mb-3 info-row">

                        <div>
                            <h3>Teléfono</h3>
                            <p>
                                +591 70000000<br>
                                +591 72000000
                            </p>
                        </div>

                    </div>

                    <!-- Correo electrónico -->
                    <div class="d-flex align-items-center gap-3 mb-3 info-row">

                        <div>
                            <h3>Correo electrónico</h3>
                            <p>info@cineplus.com</p>
                        </div>

                    </div>

                    <!-- Horario de atención -->
                    <div class="d-flex align-items-center gap-3 mb-3 info-row">

                        <div>
                            <h3>Horario de atención</h3>
                            <p>
                                Lunes a Domingo<br>
                                10:00 a 22:00
                            </p>
                        </div>

                    </div>

                    <hr class="contact-divider">

                    <!-- Redes sociales -->
                    <h3 class="social-title mb-3">
                        Síguenos en nuestras redes
                    </h3>

                    <div class="d-flex gap-2 social-links">

                        <i class="bi bi-facebook"></i>
                        <i class="bi bi-instagram"></i>
                        <i class="bi bi-tiktok"></i>
                        <i class="bi bi-youtube"></i>
                        <i class="bi bi-twitter-x"></i>

                    </div>

                </div>
            </div>
        </aside>


        <!-- 3B. TARJETA DEL FORMULARIO -->
        <section class="col-12 col-lg-8">

            <div class="card form-card h-100">

                <div class="card-body p-4 p-xl-5">

                    <!-- Título del formulario -->
                    <div class="d-flex align-items-center gap-3 mb-4 form-heading">

                        <h2 class="section-title mb-0">
                            Envíanos un mensaje
                        </h2>

                    </div>

                    <!-- Formulario de contacto -->
                    <form id="contactForm">

                        <!-- Nombre y correo -->
                        <div class="row g-3 mb-3">

                            <div class="col-12 col-md-6">

                                <label class="input-group cine-input">

                                    <input class="form-control"
                                        type="text"
                                        name="nombre"
                                        placeholder="Nombre completo *"
                                        required>

                                </label>

                            </div>

                            <div class="col-12 col-md-6">

                                <label class="input-group cine-input">

                                    <input class="form-control"
                                        type="email"
                                        name="correo"
                                        placeholder="Correo electrónico *"
                                        required>

                                </label>

                            </div>

                        </div>


                        <!-- Lista para seleccionar el asunto -->
                        <div class="input-group cine-input mb-3">

                            <select class="form-select" name="asunto" required>

                                <option value="" selected disabled>
                                    Asunto *
                                </option>

                                <option>
                                    Consulta sobre entradas
                                </option>

                                <option>
                                    Combos y promociones
                                </option>

                                <option>
                                    Problema con mi compra
                                </option>

                                <option>
                                    Sugerencia
                                </option>

                                <option>
                                    Otro
                                </option>

                            </select>

                        </div>


                        <!-- Área para escribir el mensaje -->
                        <label class="input-group cine-input message-input mb-4">

                            <textarea class="form-control"
                                name="mensaje"
                                placeholder="Tu mensaje"></textarea>

                        </label>


                        <!-- Botón para enviar -->
                        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">

                            <p id="formStatus" class="mb-0" role="status"></p>

                            <button class="btn send-btn ms-sm-auto" type="submit">

                                <i class="bi bi-send me-3"></i>
                                Enviar mensaje

                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </section>

    </div>

</main>





<!-- JavaScript del formulario -->
<script>

    const formulario = document.getElementById("contactForm");
    const mensajeEstado = document.getElementById("formStatus");

    formulario.addEventListener("submit", function(evento) {

        // Evita que la página se recargue
        evento.preventDefault();

        // Muestra una confirmación visual
        mensajeEstado.textContent =
            "¡Gracias! Tu mensaje está listo para enviarse.";

        // Limpia los campos
        formulario.reset();

    });

</script>
<script src="js/main.js"></script>

</body>
</html>
<div id="footer-container"></div>
