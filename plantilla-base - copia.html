    <title>Confiteria | CinePrime</title>

    <meta name="description"
        content="Plataforma de streaming y cartelera de cine CinePrime. XX Feria Informática ISEC La Paz.">
    <meta name="author" content="Carrera de Sistemas Informáticos - ISEC La Paz">

<body class="bg-surface">

                    <a class="navbar-brand d-flex align-items-center gap-2 m-0 text-decoration-none" href="index.html">
                        <span class="material-symbols-outlined text-cm-primary-container fs-2">movie</span>
                        <span

                        <a class="nav-link-custom" href="cartelera.html">Cartelera</a>

                        </button>

                        <!-- BOTÓN DESKTOP MODIFICADO PARA ABRIR EL MODAL -->
                        <button type="button"
                            class="btn btn-cm-primary font-label-lg text-uppercase tracking-wider rounded-3 px-3 py-2 d-none d-sm-inline-flex align-items-center gap-2"
                            data-bs-toggle="modal" data-bs-target="#authModal">
                            <span class="material-symbols-outlined fs-5">person</span>
                            <span>Ingresar</span>
                        </button>

                        <div
                            class="user-avatar-circle d-flex d-sm-none align-items-center justify-content-center shrink-0">
                            <span class="material-symbols-outlined text-cm-on-primary">person</span>
                        </div>

                            data-bs-toggle="collapse" data-bs-target="#mobile-nav-panel"
                            aria-controls="mobile-nav-panel" aria-expanded="false" aria-label="Menú">
                            <span class="material-symbols-outlined fs-2">menu</span>
